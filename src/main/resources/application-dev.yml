# File-backed development DB, not an approved production DB.
spring:
  datasource:
    url: ${BACKOFFICE_DEV_DB_URL:jdbc:h2:file:./.local-data/backoffice;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${BACKOFFICE_DEV_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/h2
  thymeleaf:
    cache: false

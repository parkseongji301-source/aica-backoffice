<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('게시물 상세')}"></head>
<body><header th:replace="~{fragments :: header}"></header><main>
  <h1 th:text="${post.title}"></h1>
  <p class="meta">작성자 <span th:text="${post.authorName}"></span> · 등록 <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span> · 수정 <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></p>
  <div class="content" th:text="${post.content}"></div>
  <div class="actions">
    <a class="button" th:href="@{/admin/posts/{id}/edit(id=${post.id})}">게시물 수정</a>
    <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post"><button class="danger" type="submit">게시물 삭제</button></form>
    <a th:href="@{/admin/posts}">목록으로</a>
  </div>
</main></body></html>
